[package]
name = "onekeepass-core"
version = "0.25.0"
authors = ["jeyasankar"]
edition = "2021"
## Не попадает в архив при `cargo package` / публикации крейта. На `cargo build` и на
## сборку под Android не влияет — dev-инструменты и тестовые данные и так вне `src/`.
exclude = ["tools/", "tests/resources/", ".venv/"]

[dependencies]
secstr = "0.5.1"
# Volatile, non-elidable zeroing of in-memory secrets. Used by the  
# memory-security lock to wipe the decrypted content (transient serialization
# buffers + the dropped entry object graph) when a database is locked.
zeroize = "1"

data-encoding = "2.9.0"
base64 = "0.22.1"
url = "2.5.7"
urlencoding = "2.1.3"

# Public Suffix List for registrable-domain (eTLD+1) autofill URL matching. The
# list is compiled into the binary (no runtime network / file I/O).
# To update the list regularly, need to do 
# cargo update -p psl in 'desktop/src-tauri' and in 'db-service-ffi'
psl = "2"

uuid = { version = "1.18.1", features = ["serde", "v4","macro-diagnostics"] }
chrono =  {version = "0.4.42", features = ["serde"]}
chrono-tz = "0.9.0"

flate2 = {version = "1.1", features = ["zlib"]} 

slice_as_array = "1.1.0"
log = "0.4.28"
hex-literal = "0.3.4"
hex = "0.4.3"
once_cell = "1"
thiserror = "2.0.17"
regex = "1.12.2"
lazy_static = "1.5.0"

tokio = { version = "1", features = [ "time" ,"rt", "rt-multi-thread","sync"] }

serde = { version = "1", features = [ "derive" ]}
serde_json = "1"
rmp-serde = "1.3.0" 
cfg-if = "1.0"

enum_dispatch = "0.3.13"

quick-xml = "0.41.0"

chbs = "0.1.1"
nom = "7.1.3"

csv = "1.4.0"

######## SFTP and WebDav ########


russh-sftp = "2.3.0"
## russh 0.60.3+ fixes RUSTSEC-2026-0154 (unbounded SSH-agent frame allocation).
## russh-keys is no longer a separate dep: keys now live in russh::keys.
russh = "0.61.2"

## This works for ios and android as it uses rustls
reqwest_dav = {version = "0.3.3", default-features = false,features = ["rustls-tls"]}

## reqwest 0.13 (pulled by reqwest_dav 0.3) defaults to rustls-platform-verifier
## for cert validation, which needs JVM init on Android. To avoid that we build a
## rustls config trusting the bundled Mozilla roots (webpki-roots) and hand it to
## reqwest via use_preconfigured_tls (see src/net_tls.rs). rustls is already in the
## tree via reqwest_dav; pinning 0.23 keeps the ClientConfig type matching reqwest's.
rustls = "0.23"
webpki-roots = "1.0"

######## END SFTP and WebDav ########

## rusqlite = { version = "0.32.0", features = ["bundled"] }

######## KDBX crypto (pure Rust) ########
## RustCrypto generation digest 0.11 / cipher 0.5 — the same one russh already pulls in.
aes      = "0.9"
cbc      = { version = "0.2", features = ["alloc"] }
aes-gcm  = "0.11"
chacha20 = "0.10"
hmac     = "0.13"
sha1     = "0.11"
## Renamed: the direct `sha2` 0.10 below is still required by passkey code (rsa 0.9 needs
## digest 0.10). Drop the alias once rsa/p256 move to digest 0.11.
sha2_v011 = { package = "sha2", version = "0.11" }
## `parallel` computes Argon2 lanes on rayon threads — keeps the `parallelism` KDF parameter
## as fast as the former C implementation.
argon2    = { version = "0.6", features = ["parallel"] }
getrandom = "0.4"
######## END KDBX crypto ########

# Passkey / WebAuthn cryptography (shared across desktop and mobile)
p256           = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
ed25519-dalek  = { version = "2", features = ["pkcs8", "rand_core"] }
rsa            = { version = "0.9", features = ["sha2"] }
sha2           = "0.10"
ciborium       = "0.2"
rand_core      = { version = "0.6", features = ["getrandom"] }


[dependencies.passwords]
version = "*"
features = ["common-password"]

[features]
desktop-ssh-agent = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }

[dev-dependencies]
env_logger = "0.11.8"
test-context = "=0.4.1"

## Argon2 is memory-hard: unoptimized Rust (dev/test profile) makes every database open/save
## several times slower (db_file_reading_writing tests 9 s -> 37 s, debug Android builds suffer
## the same). Optimize only the KDF crates; our own code stays debuggable. `test` inherits `dev`,
## release is unaffected (already opt-level 3). blake2 is used inside Argon2.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
