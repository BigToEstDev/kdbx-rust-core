[package]
name = "kdbx-rust-core"
version.workspace = true
description = "Read, write and merge KeePass KDBX 4 databases in pure Rust"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
## Originally onekeepass-core by jeyasankar (GPL-3.0). This is now an independent project: the api
## and the internals have diverged far enough that upstream is no longer merged, but the code
## descends from it and stays under the same licence -- see README.md and LICENSE.
license.workspace = true
## Не попадает в архив при `cargo package` / публикации крейта. На `cargo build` и на
## сборку под Android не влияет — тестовые данные и так вне `src/`.
exclude = ["tests/resources/"]

[dependencies]
# Volatile, non-elidable zeroing of in-memory secrets. Used by the  
# memory-security lock to wipe the decrypted content (transient serialization
# buffers + the dropped entry object graph) when a database is locked.
zeroize.workspace = true

data-encoding = "2.9.0"
base64.workspace = true
url = "2.5.7"
urlencoding = "2.1.3"

uuid = { workspace = true, features = ["v4", "macro-diagnostics"] }
chrono =  {version = "0.4.42", features = ["serde"]}

## Без фичи "zlib": бэкенд miniz_oxide (чистый Rust). Фича тянула libz-sys, последнюю C-зависимость.
flate2 = "1.1"

log.workspace = true
hex = "0.4.3"
once_cell = "1"
thiserror = "2.0.17"
regex = "1.12.2"
lazy_static = "1.5.0"

tokio = { version = "1", features = [ "time" ,"rt", "rt-multi-thread","sync"] }

serde.workspace = true
serde_json.workspace = true
cfg-if = "1.0"


quick-xml = "0.41.0"

nom = "7.1.3"


## rusqlite = { version = "0.32.0", features = ["bundled"] }

######## KDBX crypto (pure Rust) ########
## RustCrypto generation digest 0.11 / cipher 0.5.
aes      = "0.9"
cbc      = { version = "0.2", features = ["alloc"] }
aes-gcm  = "0.11"
chacha20 = "0.10"
hmac     = "0.13"
sha1     = "0.11"
sha2     = "0.11"
## `parallel` computes Argon2 lanes on rayon threads — keeps the `parallelism` KDF parameter
## as fast as the former C implementation.
argon2    = { version = "0.6", features = ["parallel"] }
getrandom = "0.4"
######## END KDBX crypto ########

# Passkey / WebAuthn cryptography (shared across desktop and mobile)


[dependencies.passwords]
version = "3.1"
features = ["common-password"]

[features]
## Dev-only: re-adds db_service::export_as_xml, which dumps the whole decrypted database
## (all passwords in plain text) to a file. Off by default -- not part of the public API.
## Enabled for the test build through the self dev-dependency below.
xml-dump = []

[dev-dependencies]
## Cyclic dev-dependency on purpose: it turns on `xml-dump` for the test build only, so the
## data-preservation tests can dump the database as xml, while normal and Android builds
## (and the FFI surface) have no such export.
kdbx-rust-core = { path = ".", features = ["xml-dump"] }

env_logger = "0.11.8"
test-context = "=0.4.1"
## Used only by db_merge/merge_tests/common.rs
secstr = "0.5.1"
## Used only by one test in util.rs (chrono_tz::US::Pacific). Kept at 0.10+ on purpose:
## chrono-tz-build 0.3 pulled phf_generator 0.11 -> rand 0.8.5 (RUSTSEC-2026-0097, unsound).
## From chrono-tz 0.10 the chain is chrono-tz-build 0.5 -> phf_codegen 0.12 -> fastrand.
chrono-tz = "0.10.4"
