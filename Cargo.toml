## The workspace of the core: the kdbx engine and the api the apps call. Only workspace settings live
## here - members, shared dependency versions and profiles. The crates are in crates/.
[workspace]
resolver = "2"
members = ["crates/kdbx-rust-core"]

[workspace.package]
authors = ["BigToEstDev"]
edition = "2021"

## Versions the crates of the workspace share, declared once so they cannot drift apart. A crate takes
## one with `<name>.workspace = true` and adds its own features on top.
[workspace.dependencies]
zeroize = "1"
base64 = "0.22.1"
uuid = { version = "1.18.1", features = ["serde"] }
log = "0.4.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

## Profiles apply only from the workspace root: the same sections in a member's Cargo.toml are ignored.
##
## Argon2 is memory-hard: unoptimized Rust (dev/test profile) makes every database open/save
## several times slower (db_file_reading_writing tests 9 s -> 37 s, debug Android builds suffer
## the same). Optimize only the KDF crates; our own code stays debuggable. `test` inherits `dev`,
## release is unaffected (already opt-level 3). blake2 is used inside Argon2.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

## miniz_oxide - gzip-бэкенд flate2 после отказа от фичи "zlib" (Step 15 п.1). Чистый Rust, поэтому
## в debug он неоптимизирован, а компрессия идёт на каждом сохранении базы. Та же причина, что у argon2.
[profile.dev.package.miniz_oxide]
opt-level = 3
